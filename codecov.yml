coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# Coverage is measured in packages/pdt, so the report's paths start at its src/.
fixes:
  - '^src/::packages/pdt/src/'

flags:
  unit:
    paths: [packages/pdt/src/]
    carryforward: true

comment:
  layout: 'condensed_header, diff, flags, files'
