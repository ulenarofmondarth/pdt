coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# One flag per package. The lcov reports give paths from the repository root.
flags:
  pdt:
    paths: [packages/pdt/src/]
    carryforward: true
  fvtt-resolver:
    paths: [packages/fvtt-resolver/src/]
    carryforward: true

comment:
  layout: 'condensed_header, diff, flags, files'
