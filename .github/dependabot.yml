version: 2
updates:
  # Python requirements of the documentation build.
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    commit-message:
      prefix: build(docs)

  # Base image of the documentation build.
  - package-ecosystem: docker
    directory: /docs
    schedule:
      interval: weekly
    commit-message:
      prefix: build(docs)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(workflows)
