name: Release

# Pushes to `main` (normally a merge from `dev`) are released:
#
#   1. Dev CI runs in full. Nothing is released unless it passes.
#   2. semantic-release works out the version from the commits, tags it, writes the changelog
#      and creates the GitHub release with the documentation (.zip) attached.
#   3. If a release was cut, `dev` is brought up to date with the release commit.
#   4. The documentation is published to GitHub Pages.
#
# It can also be started by hand on `main` (Actions > Release > Run workflow), for example to
# publish Pages again after a stalled deployment: Pages names deployments after the commit, so a
# re-run cannot replace a cancelled one, but a manual run releases only if there is something to
# release and otherwise just republishes the documentation.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  ci:
    name: CI
    # A manual run can be started on any branch; only main is released and published.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/dev.yml
    secrets: inherit

  release:
    name: Semantic release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      # The release App is on the rulesets' bypass list, so its token may push to the
      # protected branches. Each token expires within an hour.
      - name: Get a release token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Commit as the release App
        id: identity
        run: |
          name='${{ steps.app-token.outputs.app-slug }}[bot]'
          id=$(gh api "/users/${name}" --jq .id)
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${name}@users.noreply.github.com" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # semantic-release pushes with the App token (below).
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Release
        id: release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.identity.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.identity.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.identity.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.identity.outputs.email }}

  sync-dev:
    name: Bring dev up to date
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      # The release App is on the rulesets' bypass list, so its token may push to the
      # protected branches. Each token expires within an hour.
      - name: Get a release token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      # Fast-forwards dev onto the release commit. If dev has moved on, or the push is refused,
      # opens a pull request from main to dev instead (unless one is already open).
      - name: Merge main into dev
        run: |
          git fetch origin dev
          if git merge-base --is-ancestor origin/dev HEAD && git push origin HEAD:dev; then
            exit 0
          fi
          if gh pr list --base dev --head main --state open --json number --jq '.[0]' | grep -q .; then
            echo "A pull request from main to dev is already open."
            exit 0
          fi
          gh pr create --base dev --head main \
            --title "chore(release): merge v${VERSION} back into dev" \
            --body "Brings the release commit (version, changelog) from main back into dev."
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.release.outputs.version }}

  pages:
    name: Publish to GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.version != '' && format('v{0}', needs.release.outputs.version) || github.sha }}
      # Built here rather than by docs.yml, so the documentation carries the release's version.
      - uses: ./.github/actions/build-docs
      - uses: actions/configure-pages@v6
      # One artifact per attempt: a re-run of this job otherwise finds two named github-pages.
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: docs/_build/html
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
