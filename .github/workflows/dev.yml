name: Dev CI

# The full quality gate. Runs on every push to `dev` and on every pull request. The release
# workflow calls it for pushes to `main`, so nothing is released without passing it.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
  workflow_dispatch:

concurrency:
  group: dev-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Lint the pull request's commit messages
        run: >-
          pnpm exec commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The paraglide message modules are generated by the Vite plugin.
      - run: pnpm build
      - name: Typecheck (TypeScript 7)
        run: pnpm typecheck
      - name: Typecheck (TypeScript 6 fallback)
        run: pnpm typecheck:fallback

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: ESLint
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Tests with the coverage gate
        run: pnpm test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.ts packages/pdt/coverage/coverage-summary.json 'Unit coverage' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: packages/pdt/coverage/lcov.info
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Keep the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: packages/pdt/coverage
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      # Runs the built CLI as a user would: exit codes, output, configuration, logging, init.
      - name: Test the built CLI
        run: pnpm test:cli
      - name: Keep the build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: packages/pdt/dist
          retention-days: 7

  docs:
    name: Docs
    uses: ./.github/workflows/docs.yml

  # A single required check for branch protection.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [commits, typecheck, lint, unit, build, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Check that every job passed (or was skipped)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
